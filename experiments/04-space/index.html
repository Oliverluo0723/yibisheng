<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>04 空間</title>
    <style>
      :root {
        --hud: #5c5446;
        --hud-soft: #8a7f6a;
        --ring: #3b352b;
      }
      body.dark {
        --hud: #e9e4f5;
        --hud-soft: #a59fc7;
        --ring: #fcfaf2;
      }
      body { margin: 0; overflow: hidden; background: #dac9a6; }
      canvas { display: block; touch-action: none; }
      .hud {
        position: fixed;
        color: var(--hud);
        font-family: 'Noto Serif TC', 'Songti TC', 'Hiragino Mincho ProN', serif;
        user-select: none;
        transition: opacity 0.4s;
      }
      body.hide-hud .hud { opacity: 0; pointer-events: none; }
      /* 背景是照片或影片時，字加一圈光暈才讀得到 */
      body.media .hud { text-shadow: 0 0 4px rgba(255, 255, 255, 0.9), 0 0 10px rgba(255, 255, 255, 0.6); }
      body.media.dark .hud { text-shadow: 0 0 4px rgba(0, 0, 0, 0.9), 0 0 10px rgba(0, 0, 0, 0.6); }
      #label {
        left: 28px;
        bottom: 28px;
        writing-mode: vertical-rl;
        pointer-events: none;
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }
      #brush-name { font-size: 42px; letter-spacing: 0.25em; line-height: 1; }
      #color-name { font-size: 15px; letter-spacing: 0.3em; color: var(--hud-soft); }
      #color-name small { font-size: 10px; letter-spacing: 0.2em; }
      #swatches {
        left: 50%;
        bottom: 26px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 9px;
      }
      #palette-name { font-size: 13px; letter-spacing: 0.4em; color: var(--hud-soft); margin-right: 6px; }
      .sw {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 0;
        padding: 0;
        cursor: pointer;
        outline: 1px solid rgba(0, 0, 0, 0.12);
        outline-offset: 0;
        transition: transform 0.15s;
      }
      .sw:hover { transform: scale(1.15); }
      .sw.on { outline: 1.5px solid var(--ring); outline-offset: 3px; }
      .sw.auto {
        background: none;
        color: var(--hud);
        font: 12px inherit;
        font-family: inherit;
        outline: 1px dashed var(--hud-soft);
      }
      #keys {
        left: 16px;
        top: 60px;
        font-size: 12px;
        color: var(--hud-soft);
        letter-spacing: 0.08em;
      }
      #keys a { color: inherit; }
      #toggles { margin-top: 4px; letter-spacing: 0.3em; }
      #status { right: 16px; bottom: 14px; font-size: 12px; color: var(--hud-soft); pointer-events: none; }
      /* 手勢：手指位置的圈圈（捏下去變實心）與右下角的鏡像小畫面 */
      .hand-cursor {
        position: fixed;
        left: -11px;
        top: -11px;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2px solid var(--hud);
        pointer-events: none;
        z-index: 30;
        transition: background 0.1s, width 0.1s, height 0.1s;
      }
      .hand-cursor.down { background: var(--hud); }
      .hand-cursor.open { left: -22px; top: -22px; width: 44px; height: 44px; border-style: dashed; }
      .hand-cursor[hidden] { display: none; }
      .hand-preview {
        position: fixed;
        right: 16px;
        bottom: 16px;
        width: 160px;
        border-radius: 10px;
        transform: scaleX(-1);
        opacity: 0.75;
        z-index: 18;
        pointer-events: none;
      }
      .hand-preview[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="keys" class="hud">
      左鍵畫 · E 順時針轉 · Q 逆時針轉 · 滾輪縮放 · 用手：捏＝畫、張開手掌揮＝轉、比 1–4＝換種 · ` 調整 · 1–5 種 · P 紙 · B 景 · H 隱藏 ·
      <a href="../../index.html">實驗目錄</a>
      <div id="toggles"></div>
    </div>
    <div id="label" class="hud">
      <div id="brush-name"></div>
      <div id="color-name"></div>
    </div>
    <div id="status" class="hud"></div>
    <script type="module" src="./main.ts"></script>
    <script type="module">
      import { mountModeNav } from '../../src/ui/modeNav.ts';

      mountModeNav('3D');
    </script>
  </body>
</html>
